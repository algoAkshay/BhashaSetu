name: Python tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bhashasetu_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Ephemeral CI containers only; no deployment credentials or paid providers.
      TEST_DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/bhashasetu_test
      TEST_REDIS_URL: redis://localhost:6379/0
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      ASR_LOG_TRANSCRIPTS: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      # Tests run Alembic against their own isolated schema/database.
      - run: python -m pytest -q
